<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient (Pure Smart Pocket Royal Blue) -->
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="sw-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Emerald Coin Gradient -->
    <linearGradient id="sw-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Rose Coin Gradient -->
    <linearGradient id="sw-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="sw-shadow-wallet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.45"/>
    </filter>

    <filter id="sw-coin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sw-bg)" stroke="url(#sw-border)" stroke-width="2.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="230" r="170" fill="#60A5FA" opacity="0.35"/>

  <!-- ==================================================== -->
  <!-- FLOATING COINS & FLOW                                -->
  <!-- ==================================================== -->
  
  <!-- Green Income Coin (+) entering wallet from top-left -->
  <g transform="translate(100, 110)" filter="url(#sw-coin-shadow)">
    <circle cx="36" cy="36" r="36" fill="url(#sw-green)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Plus Sign -->
    <path d="M 36 22 L 36 50 M 22 36 L 50 36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Rose Expense Coin (−) leaving wallet to top-right -->
  <g transform="translate(340, 120)" filter="url(#sw-coin-shadow)">
    <circle cx="36" cy="36" r="36" fill="url(#sw-rose)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Minus Sign -->
    <path d="M 22 36 L 50 36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ==================================================== -->
  <!-- CENTRAL WHITE SMART POCKET WALLET                    -->
  <!-- Friendly, bold, iconic (Matches app header & navbar) -->
  <!-- ==================================================== -->
  <g transform="translate(106, 175)" filter="url(#sw-shadow-wallet)">
    <!-- Main Wallet Body -->
    <rect width="300" height="230" rx="42" fill="#FFFFFF"/>

    <!-- Wallet Top Fold Flap -->
    <path d="M 0 65 C 100 95, 200 95, 300 65" fill="none" stroke="#DBEAFE" stroke-width="4"/>

    <!-- Wallet Clasp / Pocket Button -->
    <rect x="210" y="95" width="90" height="64" rx="20" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="245" cy="127" r="8" fill="#FFFFFF"/>

    <!-- 3-Bucket Color Indicator Dots (Signature of the app) -->
    <g transform="translate(45, 140)">
      <!-- Blue Bucket Dot -->
      <circle cx="16" cy="16" r="14" fill="#3B82F6"/>
      <!-- Green Bucket Dot -->
      <circle cx="56" cy="16" r="14" fill="#10B981"/>
      <!-- Amber Bucket Dot -->
      <circle cx="96" cy="16" r="14" fill="#F59E0B"/>
    </g>

    <!-- Bottom App Accent Bar -->
    <rect x="45" y="190" width="210" height="6" rx="3" fill="#EFF6FF"/>
  </g>
</svg>
