<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="bs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Left Green Gradient (Income) -->
    <linearGradient id="bs-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Right Rose Gradient (Expense) -->
    <linearGradient id="bs-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Glows -->
    <filter id="glow-bs-green" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="0" stdDeviation="16" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>

    <filter id="glow-bs-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="0" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.45"/>
    </filter>

    <filter id="bs-center-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bs-bg)" stroke="url(#bs-border)" stroke-width="2.5"/>

  <!-- Background Subtle Circular Grid -->
  <circle cx="256" cy="256" r="170" stroke="#334155" stroke-width="1.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="120" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Central Modern Baht Split Graphic -->
  <g transform="translate(0, 0)" filter="url(#bs-center-shadow)">

    <!-- Vertical Split Guideline (Thin neon cyan laser line) -->
    <line x1="256" y1="80" x2="256" y2="432" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>

    <!-- ==================================================== -->
    <!-- LEFT HALF: INCOME (Emerald Green with '+')           -->
    <!-- ==================================================== -->
    <g filter="url(#glow-bs-green)">
      <!-- Left Vertical Bar & Left Halves of B -->
      <!-- Top Spine -->
      <path d="M 238 88 L 238 138" stroke="url(#bs-green)" stroke-width="22" stroke-linecap="round"/>
      <!-- Bottom Spine -->
      <path d="M 238 374 L 238 424" stroke="url(#bs-green)" stroke-width="22" stroke-linecap="round"/>

      <!-- Main Left Stem -->
      <rect x="180" y="138" width="58" height="236" rx="18" fill="url(#bs-green)"/>
      
      <!-- Left Upper Arm connecting to center -->
      <path d="M 200 138 L 246 138" stroke="url(#bs-green)" stroke-width="22" stroke-linecap="round"/>
      <!-- Left Middle Arm -->
      <path d="M 200 256 L 246 256" stroke="url(#bs-green)" stroke-width="20" stroke-linecap="round"/>
      <!-- Left Lower Arm -->
      <path d="M 200 374 L 246 374" stroke="url(#bs-green)" stroke-width="22" stroke-linecap="round"/>

      <!-- Plus Badge Inside Left Stem -->
      <circle cx="132" cy="256" r="20" fill="url(#bs-green)"/>
      <path d="M 132 245 L 132 267 M 121 256 L 143 256" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ==================================================== -->
    <!-- RIGHT HALF: EXPENSE (Rose Red with '−')              -->
    <!-- ==================================================== -->
    <g filter="url(#glow-bs-rose)">
      <!-- Top Right Spine -->
      <path d="M 274 88 L 274 138" stroke="url(#bs-rose)" stroke-width="22" stroke-linecap="round"/>
      <!-- Bottom Right Spine -->
      <path d="M 274 374 L 274 424" stroke="url(#bs-rose)" stroke-width="22" stroke-linecap="round"/>

      <!-- Top Loop (Upper Curve of B) -->
      <path d="M 266 138 L 315 138 C 348 138, 372 162, 372 195 C 372 228, 348 250, 315 250 L 266 250" 
            fill="none" stroke="url(#bs-rose)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Bottom Loop (Lower Curve of B) -->
      <path d="M 266 262 L 322 262 C 358 262, 384 286, 384 320 C 384 354, 358 374, 322 374 L 266 374" 
            fill="none" stroke="url(#bs-rose)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Minus Badge On Right Side -->
      <circle cx="380" cy="256" r="20" fill="url(#bs-rose)"/>
      <path d="M 369 256 L 391 256" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Center Balance Point (Smart Pocket Dot) -->
    <circle cx="256" cy="256" r="8" fill="#38BDF8"/>
    <circle cx="256" cy="256" r="16" fill="#38BDF8" opacity="0.25"/>
  </g>
</svg>
