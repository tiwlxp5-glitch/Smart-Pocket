<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <!-- Income Gradient (Emerald) -->
    <linearGradient id="h-income" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Expense Gradient (Rose) -->
    <linearGradient id="h-expense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="h-pocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .font-brand {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif;
    }
  </style>

  <!-- Left Icon Lockup (80x80 container scaled) -->
  <g transform="translate(10, 10)">
    <!-- Dark Squircle -->
    <rect width="80" height="80" rx="22" fill="url(#h-pocket)" filter="url(#h-shadow)"/>

    <!-- Mini Pocket Base -->
    <rect x="22" y="24" width="36" height="32" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <path d="M 22 34 C 33 38, 47 38, 58 34" fill="none" stroke="#64748B" stroke-width="1"/>

    <!-- Green Inward Arrow (Income) -->
    <path d="M 16 26 C 16 34, 22 38, 30 38" fill="none" stroke="url(#h-income)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 27 34 L 32 38 L 27 42" fill="none" stroke="url(#h-income)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rose Outward Arrow (Expense) -->
    <path d="M 50 46 C 58 46, 64 50, 64 58" fill="none" stroke="url(#h-expense)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 54 L 64 59 L 68 54" fill="none" stroke="url(#h-expense)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(106, 26)">
    <text x="0" y="26" class="font-brand" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Smart Pocket</text>
    <text x="0" y="48" class="font-brand" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">ระบบจัดการรายรับ • รายจ่าย</text>
  </g>
</svg>
