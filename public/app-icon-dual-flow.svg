<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="df-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Income Gradient (Emerald) -->
    <linearGradient id="df-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Expense Gradient (Rose) -->
    <linearGradient id="df-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Center Hub Gradient -->
    <linearGradient id="df-hub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-df-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>

    <filter id="glow-df-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#F43F5E" flood-opacity="0.5"/>
    </filter>

    <radialGradient id="df-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#df-bg)" stroke="url(#df-border)" stroke-width="2.5"/>

  <!-- Ambient Light Center -->
  <circle cx="256" cy="256" r="180" fill="url(#df-ambient)"/>

  <!-- Background Orbit Guide (Subtle) -->
  <circle cx="256" cy="256" r="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Center Hub Pocket Nexus -->
  <g transform="translate(256, 256)">
    <!-- Hub Plate -->
    <circle cx="0" cy="0" r="54" fill="url(#df-hub)" stroke="#475569" stroke-width="2"/>
    <!-- Inner Pocket Silhouette -->
    <rect x="-22" y="-16" width="44" height="32" rx="7" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -22 -6 C -6 2, 6 2, 22 -6" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="3" fill="#38BDF8"/>
  </g>

  <!-- ====================================================== -->
  <!-- 1. INCOME LOOP (Green / Flow In)                      -->
  <!-- Sweeping from outer top-left towards center hub        -->
  <!-- ====================================================== -->
  <g filter="url(#glow-df-green)">
    <path d="M 126 210 C 126 150, 180 126, 256 126 C 305 126, 335 145, 335 175 C 335 205, 305 220, 256 220" 
          fill="none" stroke="url(#df-green)" stroke-width="20" stroke-linecap="round"/>
    <!-- Inward Arrowhead -->
    <path d="M 276 202 L 252 220 L 276 238" 
          fill="none" stroke="url(#df-green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini Plus Indicator Badge -->
    <circle cx="126" cy="210" r="16" fill="url(#df-green)"/>
    <path d="M 126 201 L 126 219 M 117 210 L 135 210" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ====================================================== -->
  <!-- 2. EXPENSE LOOP (Rose / Flow Out)                      -->
  <!-- Sweeping from center hub outward to bottom-right       -->
  <!-- ====================================================== -->
  <g filter="url(#glow-df-rose)">
    <path d="M 256 292 C 207 292, 177 307, 177 337 C 177 367, 207 386, 256 386 C 332 386, 386 362, 386 302" 
          fill="none" stroke="url(#df-rose)" stroke-width="20" stroke-linecap="round"/>
    <!-- Outward Arrowhead -->
    <path d="M 370 286 L 386 302 L 402 286" 
          fill="none" stroke="url(#df-rose)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mini Minus Indicator Badge -->
    <circle cx="386" cy="302" r="16" fill="url(#df-rose)"/>
    <path d="M 377 302 L 395 302" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
