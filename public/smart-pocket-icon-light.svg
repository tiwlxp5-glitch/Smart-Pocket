<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient (Clean Light Minimal) -->
    <linearGradient id="bg-icon-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Income Gradient (Emerald) -->
    <linearGradient id="income-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Expense Gradient (Rose) -->
    <linearGradient id="expense-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Pocket Accent Gradient -->
    <linearGradient id="pocket-surface-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="light-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="icon-glow-green-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>

    <filter id="icon-glow-rose-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg-icon-light)" stroke="#E2E8F0" stroke-width="3" filter="url(#light-shadow)"/>

  <!-- Central Minimal Wallet / Card Pocket Base -->
  <g transform="translate(146, 156)">
    <!-- Pocket Body -->
    <rect width="220" height="200" rx="36" fill="url(#pocket-surface-light)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Inner Pocket Flap / Slot -->
    <path d="M 0 60 C 70 85, 150 85, 220 60" fill="none" stroke="#94A3B8" stroke-width="2.5"/>
    <rect x="80" y="90" width="60" height="6" rx="3" fill="#0284C7" opacity="0.9"/>
  </g>

  <!-- ====================================================== -->
  <!-- DYNAMIC INFLOW ARROW (รายรับ / INCOME)                  -->
  <!-- ====================================================== -->
  <g filter="url(#icon-glow-green-light)">
    <path d="M 96 160 C 96 210, 140 230, 196 230" fill="none" stroke="url(#income-grad-light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 180 206 L 206 230 L 180 254" fill="none" stroke="url(#income-grad-light)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Plus symbol badge (+) -->
    <circle cx="96" cy="140" r="24" fill="url(#income-grad-light)"/>
    <path d="M 96 128 L 96 152 M 84 140 L 108 140" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- ====================================================== -->
  <!-- DYNAMIC OUTFLOW ARROW (รายจ่าย / EXPENSE)              -->
  <!-- ====================================================== -->
  <g filter="url(#icon-glow-rose-light)">
    <path d="M 316 282 C 372 282, 416 302, 416 352" fill="none" stroke="url(#expense-grad-light)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 390 336 L 416 362 L 442 336" fill="none" stroke="url(#expense-grad-light)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Minus symbol badge (−) -->
    <circle cx="416" cy="372" r="24" fill="url(#expense-grad-light)"/>
    <path d="M 404 372 L 428 372" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Minimal Brand Dot at Center -->
  <circle cx="256" cy="285" r="10" fill="#0284C7"/>
  <circle cx="256" cy="285" r="18" fill="#0284C7" opacity="0.2"/>
</svg>
