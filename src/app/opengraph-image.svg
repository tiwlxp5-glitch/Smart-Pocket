<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Income Gradient (Emerald) -->
    <linearGradient id="income-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Expense Gradient (Rose) -->
    <linearGradient id="expense-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Pocket Accent Gradient -->
    <linearGradient id="pocket-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glows and Shadows -->
    <filter id="icon-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>

    <filter id="icon-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="center-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-icon)" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Ambient Light Center -->
  <circle cx="256" cy="256" r="200" fill="url(#center-light)"/>

  <!-- Central Minimal Wallet / Card Pocket Base -->
  <g transform="translate(146, 156)">
    <!-- Pocket Body with Frosted Glass Look -->
    <rect width="220" height="200" rx="36" fill="url(#pocket-surface)" stroke="#475569" stroke-width="1.5"/>

    <!-- Inner Pocket Flap / Slot -->
    <path d="M 0 60 C 70 85, 150 85, 220 60" fill="none" stroke="#64748B" stroke-width="2"/>
    <rect x="80" y="90" width="60" height="6" rx="3" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- ====================================================== -->
  <!-- DYNAMIC INFLOW ARROW (รายรับ / INCOME)                  -->
  <!-- Inward curving dynamic arrow into the top-left slot   -->
  <!-- ====================================================== -->
  <g filter="url(#icon-glow-green)">
    <!-- Path swooping from top-left into pocket -->
    <path d="M 96 160 C 96 210, 140 230, 196 230" fill="none" stroke="url(#income-grad-icon)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Arrow Head pointing inward/downward-right -->
    <path d="M 180 206 L 206 230 L 180 254" fill="none" stroke="url(#income-grad-icon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Plus symbol badge (+) -->
    <circle cx="96" cy="140" r="24" fill="url(#income-grad-icon)"/>
    <path d="M 96 128 L 96 152 M 84 140 L 108 140" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- ====================================================== -->
  <!-- DYNAMIC OUTFLOW ARROW (รายจ่าย / EXPENSE)              -->
  <!-- Outward curving dynamic arrow from pocket to bot-right -->
  <!-- ====================================================== -->
  <g filter="url(#icon-glow-rose)">
    <!-- Path swooping out of pocket to bottom-right -->
    <path d="M 316 282 C 372 282, 416 302, 416 352" fill="none" stroke="url(#expense-grad-icon)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Arrow Head pointing outward/downward -->
    <path d="M 390 336 L 416 362 L 442 336" fill="none" stroke="url(#expense-grad-icon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Minus symbol badge (−) -->
    <circle cx="416" cy="372" r="24" fill="url(#expense-grad-icon)"/>
    <path d="M 404 372 L 428 372" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Minimal Brand Dot at Center -->
  <circle cx="256" cy="285" r="10" fill="#38BDF8"/>
  <circle cx="256" cy="285" r="18" fill="#38BDF8" opacity="0.3"/>
</svg>
