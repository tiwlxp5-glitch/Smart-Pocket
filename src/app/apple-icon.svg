<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient (Ultra Clean App Card White) -->
    <linearGradient id="cb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Blue Wallet Gradient (App Primary Blue) -->
    <linearGradient id="cb-wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Soft Drop Shadow (Matches app's shadow-sm / shadow-md) -->
    <filter id="cb-shadow-squircle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="cb-shadow-wallet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1D4ED8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .font-cb {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif;
    }
  </style>

  <!-- Base Squircle (Clean White Card) -->
  <rect x="18" y="18" width="476" height="476" rx="114" fill="url(#cb-bg)" stroke="#E2E8F0" stroke-width="3" filter="url(#cb-shadow-squircle)"/>

  <!-- ==================================================== -->
  <!-- 3 ENVELOPE / BUCKET CARDS PEAKING OUT (Like in app)  -->
  <!-- 1. Emergency (Amber #F59E0B)                         -->
  <!-- 2. Investment (Emerald #10B981)                      -->
  <!-- 3. Living (Blue #3B82F6)                             -->
  <!-- ==================================================== -->
  
  <!-- Left Tab: Emergency Fund (Amber) -->
  <g transform="translate(100, 105)">
    <rect width="90" height="70" rx="18" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="45" cy="30" r="16" fill="#F59E0B"/>
    <!-- Mini Shield Icon -->
    <path d="M 45 20 L 53 23 C 53 29, 49 35, 45 38 C 41 35, 37 29, 37 23 Z" fill="#FFFFFF"/>
    <text x="45" y="58" class="font-cb" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">20%</text>
  </g>

  <!-- Center Tab: Investment Fund (Emerald / Income) -->
  <g transform="translate(211, 80)">
    <rect width="90" height="85" rx="18" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="2"/>
    <circle cx="45" cy="30" r="16" fill="#10B981"/>
    <!-- Trending Up Icon -->
    <path d="M 39 34 L 44 28 L 47 31 L 52 25 M 52 25 L 48 25 M 52 25 L 52 29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="60" class="font-cb" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">+30%</text>
  </g>

  <!-- Right Tab: Living Expense (Rose / Living) -->
  <g transform="translate(322, 105)">
    <rect width="90" height="70" rx="18" fill="#FFE4E6" stroke="#FECDD3" stroke-width="2"/>
    <circle cx="45" cy="30" r="16" fill="#F43F5E"/>
    <!-- Minus / Shopping Icon -->
    <line x1="39" y1="30" x2="51" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="45" y="58" class="font-cb" font-size="11" font-weight="800" fill="#BE123C" text-anchor="middle">−50%</text>
  </g>

  <!-- ==================================================== -->
  <!-- CENTRAL ROYAL BLUE SMART POCKET WALLET               -->
  <!-- ==================================================== -->
  <g transform="translate(106, 155)" filter="url(#cb-shadow-wallet)">
    <!-- Main Wallet Body -->
    <rect width="300" height="225" rx="38" fill="url(#cb-wallet)"/>

    <!-- Top Fold Curved Lip -->
    <path d="M 0 65 C 100 95, 200 95, 300 65" fill="none" stroke="#60A5FA" stroke-width="3"/>

    <!-- Center White Badge with App Name / Icon -->
    <g transform="translate(110, 100)">
      <rect width="80" height="60" rx="18" fill="#FFFFFF" filter="url(#cb-shadow-squircle)"/>
      <!-- App Name Symbol 'S' in Royal Blue -->
      <text x="40" y="42" class="font-cb" font-size="34" font-weight="900" fill="#1D4ED8" text-anchor="middle">S</text>
      <!-- Small Baht Dot -->
      <circle cx="60" cy="22" r="4" fill="#10B981"/>
    </g>

    <!-- Pocket Seam Accent -->
    <rect x="40" y="180" width="220" height="4" rx="2" fill="#60A5FA" opacity="0.4"/>
  </g>

  <!-- Bottom Brand Title Pill (Matches app button) -->
  <g transform="translate(256, 430)" text-anchor="middle">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="0" y="5" class="font-cb" font-size="13" font-weight="800" fill="#1D4ED8">Smart Pocket</text>
  </g>
</svg>
